services:
  api:
    build: ./api
    env_file:
      - ./api/.env
    environment:
      # Non-interactive container: let pnpm's pre-run deps check reinstall
      # without prompting to purge node_modules (no TTY → it would abort).
      CI: "true"
    ports:
      - "6969:6969"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:6969/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    # Hot reload via Compose Watch (`docker compose up --watch`): edits are
    # copied into the container, so the watcher inside sees real file events.
    # A plain bind mount doesn't work on Docker Desktop for Windows — inotify
    # events from the host never reach the Linux container, so `nest --watch`
    # never noticed a save. node_modules and dist stay the container's own.
    develop:
      watch:
        - action: sync
          path: ./api
          target: /app
          ignore:
            - node_modules/
            - dist/
        # New/changed dependencies need a fresh `pnpm install` in the image.
        - action: rebuild
          path: ./api/package.json
        - action: rebuild
          path: ./api/pnpm-lock.yaml

  web:
    build: ./web
    # `depends_on` does not wait when both services are manually restarted.
    # Hold Next.js until the API has completed its watch-mode compilation and
    # is serving readiness, otherwise the dashboard layout sees ECONNREFUSED.
    command: >-
      sh -c "find .next -mindepth 1 -maxdepth 1 -exec rm -rf {} +; until node -e \"fetch('http://api:6969/health/ready').then(r =>
      process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"; do sleep 1; done;
      pnpm dev"
    env_file:
      - ./web/.env.local
    environment:
      # Non-interactive container: let pnpm's pre-run deps check reinstall
      # without prompting to purge node_modules (no TTY → it would abort).
      CI: "true"
      # Server-side calls stay inside the compose network; the browser still
      # hits the API through the published port on localhost.
      API_URL: http://api:6969
      # Inlined into the client bundle at dev/build time: the browser reaches
      # the api via the host-published port, not the compose-network name.
      NEXT_PUBLIC_API_URL: http://localhost:6969
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    # Same Compose Watch setup as `api` — Turbopack has no polling mode, so
    # syncing files in is what makes Next.js pick up host edits on Windows.
    develop:
      watch:
        - action: sync
          path: ./web
          target: /app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ./web/package.json
        - action: rebuild
          path: ./web/pnpm-lock.yaml
